<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="D2Coding, &#x27;Noto Sans Mono CJK KR&#x27;, ui-monospace, Consolas, &#x27;Malgun Gothic&#x27;, &#x27;Apple SD Gothic Neo&#x27;, monospace">
<style>
    .f { opacity: 0; animation: in .45s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .strike { stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw .5s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .t  { fill: #e6edf3; font-size: 17px; }
    .dim { fill: #8b949e; font-size: 14px; letter-spacing: .06em; }
    .bad { fill: #ff7b72; font-size: 15px; }
    .ok  { fill: #7ee787; } .no { fill: #ff7b72; } .un { fill: #e3b341; }
    .sum { fill: #e6edf3; font-size: 17px; font-weight: 700; }
.dim { letter-spacing: 0; }</style>
<rect width="1280" height="640" fill="#0d1117"/>
<text x="640" y="70" text-anchor="middle" fill="#e6edf3" font-size="40" font-weight="700">🧾 receipts</text>
<text x="640" y="108" text-anchor="middle" fill="#8b949e" font-size="20">영수증 없으면 주장도 없다.</text>
<rect x="40" y="140" width="580" height="460" rx="14" fill="#161b22" stroke="#30363d"/>
<text x="70" y="180" class="dim">BEFORE · 에이전트 보고</text>
<g class="f" style="animation-delay:0.3s"><text x="70" y="235" class="t" data-claim="0">다 고쳤어요! 테스트 3개 전부 통과 🎉</text></g>
<line class="strike" x1="66" y1="229" x2="393" y2="229" stroke="#ff7b72" stroke-width="2" style="animation-delay:2.4s"/>
<g class="f" style="animation-delay:0.8s"><text x="70" y="275" class="t" data-claim="1">쉼표랑 공백 둘 다 처리했고요</text></g>
<line class="strike" x1="66" y1="269" x2="315" y2="269" stroke="#ff7b72" stroke-width="2" style="animation-delay:3.0999999999999996s"/>
<g class="f" style="animation-delay:1.3s"><text x="70" y="315" class="t" data-claim="2">round()로 깔끔하게 정리했어요.</text></g>
<line class="strike" x1="66" y1="309" x2="337" y2="309" stroke="#ff7b72" stroke-width="2" style="animation-delay:3.8s"/>
<g class="f" style="animation-delay:2.6s"><text x="70" y="410" class="bad">↳ 테스트 출력은 한 줄도 없음</text></g>
<g class="f" style="animation-delay:3.3s"><text x="70" y="445" class="bad">↳ 실제론 .strip() — &quot;1 234원&quot;은 여전히 에러</text></g>
<g class="f" style="animation-delay:4.0s"><text x="70" y="480" class="bad">↳ 반올림 방식을 묻지도 않고 바꿈</text></g>
<g class="f" style="animation-delay:4.6s"><text x="70" y="560" class="dim">다 끝난 것 같죠? 정말요?</text></g>
<rect x="660" y="140" width="580" height="460" rx="14" fill="#161b22" stroke="#2ea043"/>
<text x="690" y="180" class="dim">AFTER · receipts 적용</text>
<g class="f" style="animation-delay:5.4s"><text x="690" y="235" class="t"><tspan class="ok">✅</tspan> parse_price(&quot;12,000원&quot;) → 12000</text><text x="722" y="258" class="dim">고친 뒤 직접 실행</text></g>
<g class="f" style="animation-delay:6.0s"><text x="690" y="298" class="t"><tspan class="ok">✅</tspan> test_price.py 3개 통과</text><text x="722" y="321" class="dim">test_ 함수 직접 호출</text></g>
<g class="f" style="animation-delay:6.6000000000000005s"><text x="690" y="361" class="t"><tspan class="no">❌</tspan> &quot;1 234원&quot; → ValueError</text><text x="722" y="384" class="dim">재현함, 그대로 둠</text></g>
<g class="f" style="animation-delay:7.2s"><text x="690" y="424" class="t"><tspan class="no">❌</tspan> apply_discount(999, 10) → 899.1</text><text x="722" y="447" class="dim">원 단위로 반올림할까요? 결정 필요</text></g>
<g class="f" style="animation-delay:7.800000000000001s"><text x="690" y="487" class="t"><tspan class="un">⚠️</tspan> 음수 할인율</text><text x="722" y="510" class="dim">테스트 안 함</text></g>
<g class="f" style="animation-delay:8.6s"><line x1="690" y1="532" x2="1210" y2="532" stroke="#30363d"/><text x="690" y="565" class="sum">receipts: <tspan class="ok">4 verified</tspan> · <tspan class="un">1 unverified</tspan></text></g>
</svg>
